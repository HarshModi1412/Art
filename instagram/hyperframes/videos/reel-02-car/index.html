      // while new followers keep ticking up
      const fc = L.div("fcount", ledger.cam, "", `<div class="label" style="color:var(--indigo)">followers</div>`);
      L.counter(fc, "position:relative;font-family:var(--mono);font-weight:700;font-size:52px;letter-spacing:-.03em", "", 1204, 1207, L2 + 0.8, at("L2e") - 0.8 - L2 + 0.8, (v) => Math.round(v).toLocaleString("en-US"), { steps: 3, ease: "none" });
      L.pop(fc, L2 + 0.4, { from: 0.7 });
      L.series(L2 + 0.8 + 0.2, at("L2e") + 0.2, 3).forEach((t) => {
        const p = L.div("abs num", ledger.cam, "left:940px;top:262px;font-size:34px;color:#1E8A5E", "+1");
        tl.fromTo(p, { y: 10, autoAlpha: 0 }, { y: -30, autoAlpha: 1, duration: 0.35, ease: "power2.out" }, t);
        tl.to(p, { autoAlpha: 0, duration: 0.3 }, t + 0.45);
      });
      // accents: torn paper scrap and a pencil mark
      L.drift(L.div("abs", ledger.cam, "left:880px;top:1360px;width:120px;height:80px;background:var(--paper2);clip-path:polygon(0 12%,100% 0,92% 100%,6% 88%);box-shadow:0 6px 12px rgba(0,0,0,.08)"), H + 0.6, EC, { period: 5, y: -8, r: 3 });
      L.ink(lsv, "M90 1500 q30 -10 60 4 t60 -2", H + 1.4, 0.3, { color: "#475467", w: 4 });

      // ================= BEAT 3 + 4 · night: found, written, sent =================
      const night = L.scene(tR, tCut, { bg: "night" });
      L.ripple(night, tR, 450, rowY(0) + 55);
      const L3 = at("L3"), L4 = at("L4");
      const ph = L.phone(night.cam, { x: 330, y: 420, w: 420, crumb: "Win-back" });
      tl.fromTo(ph, { x: -520, rotation: -8, autoAlpha: 0 }, { x: 0, rotation: 0, autoAlpha: 1, duration: 0.8, ease: "power3.out" }, L3);
      const app = ph.app;
      L.div("abs app-h1", app, "left:16px;top:74px;margin:0", "Win-back");
      const stat = L.div("abs app-card", app, "left:14px;right:14px;top:124px;height:104px;margin:0", `<div style="display:flex;align-items:baseline;gap:8px"><span class="holder" style="font-size:40px;font-weight:800;letter-spacing:-.03em;color:#C4320A"></span><span style="font-size:17px;font-weight:700">customers went quiet</span></div><div style="font-size:12px;color:#6B6B73;margin-top:4px">No order in the last 45 days</div>`);
      L.counter(stat.querySelector(".holder"), "position:relative;display:inline-block", "", 0, 60, L3 + 0.3, 0.8, (v) => String(Math.round(v)), { steps: 20 });
      const list = L.div("abs app-card", app, "left:14px;right:14px;top:240px;height:380px;margin:0;padding:0");
      const wb = [["MR", "Maya R.", "Linen Wrap Dress, Sage", "Aug 3"], ["JT", "Jordan T.", "Silk Scarf, Rust", "Jul 28"], ["PK", "Priya K.", "Gold Hoop Earrings", "Aug 11"], ["ES", "Emily S.", "Knit Sweater", "Jul 19"], ["CP", "Chris P.", "Everyday Tote", "Aug 20"], ["AL", "Ava L.", "Satin Slip Skirt", "Jul 12"]];
      const wbRows = wb.map(([i, n, it, d], k) => L.div("wb-row", list, `top:${8 + k * 60}px`, `<div class="av">${i}</div><div><b>${n}</b><small>${it}</small></div><i>${d}</i>`));
      L.series(L3 + 0.8, at("L3.1e"), wbRows.length).forEach((t, k) => L.glide(wbRows[k], t, { x: 60, dur: 0.35, ease: "power2.out" }));
      L.div("abs app-btn", app, "left:14px;right:14px;top:634px;text-align:center", "Review &amp; send");
      const appInk = L.svg(app, "", "0 0 390 844");
      appInk.setAttribute("width", 390); appInk.setAttribute("height", 844);
      const L32 = at("L3.2");
      L.circleMark(appInk, 195, 276, 188, 36, L32, 0.45, { w: 5 });
      const lift = L.div("lift", night.cam, "", `<div style="font-weight:800;font-size:44px;letter-spacing:-.02em">Maya R.</div><div style="font-weight:600;font-size:34px;color:var(--ink);margin-top:6px">Linen Wrap Dress, Sage</div><div style="font-family:var(--mono);font-weight:600;font-size:26px;color:var(--ink-soft);margin-top:10px">last order Aug 3</div>`);
      tl.fromTo(lift, { y: 40, scale: 0.72, rotationX: 70, transformPerspective: 1200, autoAlpha: 0 }, { y: 0, scale: 1, rotationX: 0, autoAlpha: 1, duration: 0.6, ease: "back.out(1.4)" }, L32 + 0.45);
      tl.to(lift, { y: 60, scale: 0.6, autoAlpha: 0, duration: 0.35, ease: "power2.in" }, L4 - 0.45);
      // the message writes itself, the coupon snaps in, check and send
      tl.to(ph, { x: -262, y: 60, rotation: -5, scale: 0.9, duration: 0.6, ease: "power3.inOut" }, L4 - 0.45);
      const msg = L.div("msg", night.cam, "", `<div class="to">EMAIL · TO MAYA R.</div>`);
      const txt = L.div("txt", msg);
      L.pop(msg, L4 - 0.15, { from: 0.8 });
      const body = "Hi Maya, the wrap dress you loved just came back in two new colors. Here's 10% off, just for you:";
      L.type(txt, body, L4, body.length / Math.max(1.5, at("L4.1:coupon") - L4 - 0.1), { el: L.el("span", "", txt) });
      const coupon = L.el("div", "coupon", txt, "", "COMEBACK10");
      L.slam(coupon, at("L4.1:coupon"), { from: 1.8 });
      const send = L.div("send", msg, "", "Check and send");
      L.rise(send, at("L4.1e") - 0.1, { y: 20, dur: 0.35 });
      const tTap = at("L4.2") + 0.2;
      tl.to(send, { scale: 0.95, duration: 0.08 }, tTap);
      tl.to(send, { scale: 1, duration: 0.18, ease: "back.out(3)" }, tTap + 0.08);
      const tapSvg = L.svg(night.cam);
      const tapRing = L.s(tapSvg, "circle", { cx: 710, cy: 1010, r: 10, fill: "none", stroke: "#F5A623", "stroke-width": 8 });
      tapRing.style.visibility = "hidden";
      tl.set(tapRing, { visibility: "visible" }, tTap);
      tl.fromTo(tapRing, { attr: { r: 10 }, opacity: 1 }, { attr: { r: 150 }, opacity: 0, duration: 0.5, ease: "power2.out" }, tTap);
      // fold into an envelope and fly back toward the ledger; two more follow
      const tFold = at("L4.2e") + 0.2;
      tl.to(msg, { scaleY: 0.06, scaleX: 0.55, duration: 0.3, ease: "power2.in" }, tFold);
      tl.set(msg, { visibility: "hidden" }, tFold + 0.3);
      const env = (delay, sx, sy) => {
        const e = L.div("abs", night.cam, `left:${sx}px;top:${sy}px;width:220px;height:146px;visibility:hidden`, `<svg width="220" height="146" viewBox="0 0 220 146"><rect x="3" y="3" width="214" height="140" rx="12" fill="#EFECE3" stroke="#101828" stroke-width="4"/><path d="M6 8 L110 84 L214 8" fill="none" stroke="#101828" stroke-width="4"/><circle cx="110" cy="86" r="16" fill="#F5A623"/></svg>`);
        const t = tFold + 0.3 + delay;
        tl.set(e, { visibility: "visible" }, t);
        tl.fromTo(e, { scale: 0.4 }, { scale: 1, duration: 0.2, ease: "back.out(2)" }, t);
        tl.to(e, { x: -700, duration: 0.75, ease: "power2.in" }, t + 0.2);
        tl.to(e, { y: 1500 - sy, rotation: -30, duration: 0.75, ease: "power1.in" }, t + 0.2);
      };
      env(0, 600, 720);
      env(0.25, 150, 900);
      env(0.5, 150, 1100);

      // ================= BEAT 5 · counted: three come back =================
      const L5 = at("L5");
      [[0, 0], [3, 0.35], [1, 0.7]].forEach(([k, d]) => {
        const t = L5 + 0.1 + d;
        tl.to(chips[k], { x: 0, y: 0, rotation: 0, duration: 0.7, ease: "power3.out" }, t);
        tl.set(empties[k], { visibility: "hidden" }, t + 0.6);
      });
      const back = L.div("abs num", ledger.cam, "left:72px;top:250px;font-size:60px;color:#139A66", "came back:&nbsp;");
      L.counter(back, "position:relative;display:inline-block", "", 0, 3, L5 + 0.2, 0.75, (v) => String(Math.round(v)), { steps: 3, ease: "none" });
      L.rise(back, L5, { y: 20 });
      L.chip(ledger.cam, "EXAMPLE", "left:530px;top:266px", L5 + 0.5);
      tl.to(fc, { opacity: 0.3, duration: 0.4 }, L5 + 0.3);

      // ================= end card =================
      L.flip(ledger, EC - 0.45);
      L.endCard(EC - 0.45, "Comment WINBACK.", { anim: EC });
      L.captions({ hide: [["L1.2", "L1e+0.3"]] });
      L.done();
    </script>
  </body>
</html>
