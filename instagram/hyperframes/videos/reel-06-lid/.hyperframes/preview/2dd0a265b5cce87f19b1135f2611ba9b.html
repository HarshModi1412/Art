    <style>/* One Tap Manager · "ledger world" motion system (from DESIGN.md) */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F7F5EF; }
:root {
  --paper: #F7F5EF; --paper2: #EFECE3; --ink: #101828; --ink-soft: #475467; --night: #111827;
  --indigo: #1E3A8A; --marigold: #F5A623; --green: #34D399; --sky: #A9C1F5; --leak: #C4320A;
  --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --hand: "Kalam", "Segoe Print", cursive;
}
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--sans); color: var(--ink); }
#stage { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
.fill { position: absolute; inset: 0; }
.abs { position: absolute; }

/* ---------- backgrounds ---------- */
.bg-paper { background-color: var(--paper); }
.ruled { background-image: repeating-linear-gradient(to bottom, transparent 0 63px, rgba(16, 24, 40, 0.07) 63px 64px); }
.grid-paper {
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 47px, rgba(30, 58, 138, 0.07) 47px 48px),
    repeating-linear-gradient(to right, transparent 0 47px, rgba(30, 58, 138, 0.07) 47px 48px);
}
.bg-night { background: radial-gradient(ellipse 70% 55% at 50% 44%, rgba(30, 58, 138, 0.62), rgba(30, 58, 138, 0.12) 60%, rgba(17, 24, 39, 0) 80%), #111827; }
.grain { position: absolute; inset: -40px; background: url(assets/grain.png); background-size: 384px; mix-blend-mode: multiply; opacity: 0.13; pointer-events: none; }
.grain.light { mix-blend-mode: screen; opacity: 0.06; }
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 55%, rgba(60, 40, 15, 0.16) 100%); pointer-events: none; }
.vignette.dark { background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 50%, rgba(0, 0, 0, 0.45) 100%); }

/* ---------- type ---------- */
.display { font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; }
.hook-line { font-weight: 800; font-size: 104px; letter-spacing: -0.035em; line-height: 1.0; }
.headline { font-weight: 800; font-size: 88px; letter-spacing: -0.03em; line-height: 1.02; }
.body { font-weight: 600; font-size: 40px; line-height: 1.3; }
.label { font-family: var(--mono); font-weight: 500; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.num { font-family: var(--mono); font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
.big-num { font-family: var(--mono); font-weight: 700; font-size: 220px; letter-spacing: -0.05em; line-height: 0.95; }
.hand { font-family: var(--hand); font-weight: 700; }
.on-night { color: var(--paper); }
.leak { color: var(--leak); } .green { color: var(--green); } .mari { color: var(--marigold); } .indigo { color: var(--indigo); } .sky { color: var(--sky); }

/* highlighter: <span class="hl"><i></i>phrase</span> */
.hl { position: relative; display: inline-block; isolation: isolate; }
.hl > i { position: absolute; left: -12px; right: -14px; top: 30%; bottom: 2%; z-index: -1; background: var(--marigold); opacity: 0.7;
  transform-origin: 0 50%; transform: rotate(-1.5deg); border-radius: 12px 26px 14px 30px / 20px 12px 24px 14px; }

/* ---------- components ---------- */
.chip { position: absolute; font-family: var(--mono); font-weight: 500; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-soft); background: var(--paper2); border-radius: 12px; padding: 10px 16px; white-space: nowrap; box-shadow: 0 2px 0 rgba(16, 24, 40, 0.06); }
.chip.dark { background: #1F2937; color: #C8D0DE; }
.card { position: absolute; background: #FFFFFF; border-radius: 28px; border: 3px solid var(--ink); box-shadow: 10px 12px 0 rgba(16, 24, 40, 0.10); }
.card.soft { border: none; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28); }
.bubble { position: absolute; background: var(--paper2); border: 2px solid var(--ink); border-radius: 24px; padding: 18px 26px; font-weight: 600; font-size: 38px; color: var(--ink); white-space: nowrap; }
.btn { position: absolute; background: var(--indigo); color: var(--paper); font-weight: 700; font-size: 38px; border-radius: 20px; padding: 24px 40px; white-space: nowrap; }
.stamp { position: absolute; font-family: var(--sans); font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap;
  border: 9px solid currentColor; border-radius: 16px; padding: 10px 26px; line-height: 1;
  -webkit-mask-image: url(assets/grain.png); mask-image: url(assets/grain.png); -webkit-mask-size: 300px; mask-size: 300px; mask-mode: luminance; }
.stamp.leak { color: var(--leak); } .stamp.indigo { color: var(--indigo); }
.receipt { position: absolute; background: var(--paper2); padding: 34px 34px 60px; font-family: var(--mono); font-weight: 500; font-size: 30px; color: var(--ink);
  box-shadow: 0 16px 40px rgba(16, 24, 40, 0.16); }
.receipt .row { display: flex; justify-content: space-between; gap: 24px; line-height: 1.7; white-space: nowrap; }
.receipt .rule { border-top: 3px dashed rgba(16, 24, 40, 0.35); margin: 12px 0; }
.ink-layer { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.ink { fill: none; stroke: var(--marigold); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.flash { position: absolute; inset: 0; background: #FFFDF7; visibility: hidden; z-index: 900; }
.ring { position: absolute; border: 10px solid var(--marigold); border-radius: 50%; pointer-events: none; }
.ai-chip { position: absolute; left: 40px; bottom: 360px; z-index: 50; }
.drift { will-change: transform; }

/* ---------- phone + rebuilt app ---------- */
.phone { position: absolute; background: #0B0C0F; border-radius: 64px; padding: 12px; box-shadow: 30px 50px 80px rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(255, 255, 255, 0.08) inset; }
.phone .screen { position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: #F2F2F7; }
.phone .tag { position: absolute; left: -26px; top: -22px; z-index: 5; }
.app { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; font-family: var(--sans); color: #111114; background: #F2F2F7; overflow: hidden; }
.app-top { height: 64px; display: flex; align-items: center; gap: 9px; padding: 0 14px; border-bottom: 1px solid #DEDEE3; background: #F7F7FA; }
.app-grid { width: 42px; height: 42px; border-radius: 50%; background: #E4E4EA; display: grid; place-items: center; }
.app-logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(160deg, #3D95FF, #0B63E0); color: #fff; font-family: var(--mono); font-weight: 700; font-size: 14px; display: grid; place-items: center; box-shadow: 0 2px 5px rgba(11, 99, 224, 0.35); }
.app-crumb { font-size: 16px; font-weight: 600; color: #3A3A3F; white-space: nowrap; }
.app-toggle { margin-left: auto; display: flex; background: #E4E4EA; border-radius: 10px; padding: 2px; }
.app-toggle span { width: 30px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; color: #555; }
.app-toggle span:first-child { background: #fff; }
.app-body { padding: 16px 14px 0; }
.app-h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin: 4px 2px 14px; }
.app-card { background: #fff; border-radius: 20px; border: 1px solid #E5E5EA; padding: 16px; margin-bottom: 12px; }
.app-card h4 { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.app-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.app-kpi { background: #fff; border-radius: 18px; border: 1px solid #E5E5EA; padding: 12px 14px; }
.app-kpi small { display: block; font-size: 12px; font-weight: 600; color: #6B6B73; }
.app-kpi b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
.app-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid #F0F0F3; font-size: 14px; }
.app-row:first-of-type { border-top: 0; }
.app-btn { display: inline-block; background: #0B6FE6; color: #fff; font-weight: 700; font-size: 15px; border-radius: 14px; padding: 11px 16px; }
.app-btn.ghost { background: #E8E8ED; color: #0B6FE6; }
.app-nav { position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: rgba(247, 247, 250, 0.96); border-top: 1px solid #DEDEE3; display: flex; justify-content: space-around; align-items: center; font-size: 12px; font-weight: 600; color: #55555C; }
.app-nav div { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.app-nav div:first-child { color: #0B6FE6; }
.app-nav i { width: 26px; height: 22px; border: 2.5px solid currentColor; border-radius: 7px; display: block; }

/* ---------- captions ---------- */
.captions { position: absolute; left: 72px; right: 150px; bottom: 440px; z-index: 800; display: flex; justify-content: center; pointer-events: none; }
.cap-page { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; visibility: hidden; }
.cap-box { background: var(--paper); border-radius: 14px; padding: 18px 28px; font-weight: 700; font-size: 54px; line-height: 1.18; color: var(--ink);
  text-align: center; box-shadow: 0 8px 24px rgba(16, 24, 40, 0.18); max-width: 858px; }
.cap-box span { display: inline; }

/* ---------- end card ---------- */
.ec-logo { position: absolute; left: 440px; top: 572px; width: 200px; height: 200px; border-radius: 46px; background: var(--indigo); color: var(--paper);
  font-family: var(--mono); font-weight: 700; font-size: 100px; letter-spacing: -0.06em; display: grid; place-items: center; }
.ec-text { position: absolute; left: 72px; right: 72px; top: 850px; text-align: center; }
.ec-comment { font-weight: 800; font-size: 72px; letter-spacing: -0.03em; line-height: 1.08; color: var(--ink); }
.ec-line2 { margin-top: 34px; font-weight: 800; font-size: 52px; letter-spacing: -0.025em; line-height: 1.1; color: var(--ink); }
.ec-handle { margin-top: 38px; font-family: var(--mono); font-weight: 500; font-size: 34px; color: var(--ink-soft); }

.rev { position: absolute; left: 0; top: 0; width: 420px; padding: 22px 26px; background: #fff; border-radius: 22px; border: 2.5px solid var(--ink); box-shadow: 8px 10px 0 rgba(16, 24, 40, 0.08); }
      .rev .st { font-size: 34px; letter-spacing: 4px; color: var(--marigold); }
      .rev .st span { color: #D8D3C7; }
      .rev .tx { font-weight: 700; font-size: 34px; color: var(--ink); margin-top: 6px; white-space: nowrap; }
      .blob { position: absolute; left: 540px; top: 900px; width: 60px; height: 60px; margin: -30px 0 0 -30px; background: #6DBE45; border-radius: 50%; }
      .sz { position: absolute; left: 470px; top: 560px; width: 460px; background: #fff; border-radius: 22px; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4); overflow: hidden; }
      .sz .r { display: grid; grid-template-columns: 80px 1fr 1fr 1fr; height: 72px; align-items: center; padding: 0 20px; font-family: var(--mono); font-weight: 600; font-size: 28px; color: var(--ink); border-top: 1px solid #ECE8DF; }
