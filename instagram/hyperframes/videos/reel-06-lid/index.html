      tl.fromTo(comp.querySelectorAll(".bo"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", stagger: 0.1 }, L3 + 1.5);
      L.rise(loud, at("L3:complaint") - 0.3, { y: 16 });
      const asv = L.svg(app, "", "0 0 390 844"); asv.setAttribute("width", 390); asv.setAttribute("height", 844);
      L.ink(asv, "M28 492 C120 498 240 488 330 494", at("L3:complaint"), 0.45, { w: 4 });
      L.rise(L.div("abs num leak", nt.cam, "left:72px;top:272px;font-size:120px;color:#F08A63", "17<span style='font-size:48px;color:var(--sky)'> of 40</span>"), L3 + 1.6);
      // Beat 4 · a real size chart, in inches, built row by row
      tl.to(ph, { x: -250, y: 90, rotation: -5, scale: 0.82, duration: 0.6, ease: "power3.inOut" }, L4 - 0.3);
      const sz = L.div("sz", nt.cam);
      const rowsSZ = [["SIZE", "BUST", "WAIST", "HIP"], ["S", "33-34", "26-27", "36-37"], ["M", "35-36", "28-29", "38-39"], ["L", "37-39", "30-32", "40-42"], ["XL", "40-42", "33-35", "43-45"]];
      const szRows = rowsSZ.map((r, i) => L.div("r" + (i ? "" : " h"), sz, "", r.map((c) => `<span>${c}</span>`).join("")));
      L.div("abs label", sz, "right:18px;bottom:-40px", "inches");
      L.glide(sz, at("L4.3") - 0.4, { x: 260, dur: 0.45, ease: "power3.out" });
      L.series("L4.3", at("L4.3e") + 0.4, 5).forEach((t, i) => L.rise(szRows[i], t, { y: 14, dur: 0.25 }));
      L.chip(nt.cam, "EXAMPLE", "left:476px;top:1000px", at("L4.3") + 0.3).classList.add("dark");
      L.rise(L.div("abs", nt.cam, "left:478px;top:1060px;font-weight:600;font-size:34px;color:var(--sky)", "boring."), at("L4.2:boring"), { y: 10 });
      tl.to(sz, { rotation: -8, y: -60, duration: 0.4, ease: "power2.out" }, at("L4e") + 0.1);

      // ================= BEAT 5 · that's the lid =================
      const lidS = L.scene(L5, EC, { bg: "paper" });
      const ls = L.svg(lidS.cam);
      L.ink(ls, dressD, null, 0, { color: "#101828", w: 5 });
      L.ink(ls, "M210 420 Q210 396 228 396 Q246 396 243 416 L210 436 L150 470 L270 470", null, 0, { color: "#101828", w: 4 });
      const spG = L.s(ls, "g", {});
      [[180, 900, 10], [230, 980, 7], [150, 1080, 12], [260, 1120, 8], [210, 1190, 11], [120, 1180, 6], [290, 1010, 6]].forEach(([x, y, r]) => L.s(spG, "circle", { cx: x, cy: y, r, fill: "#6DBE45" }));
      // ink-outline blender jar
      L.ink(ls, "M600 620 L880 620 L850 1060 L630 1060 Z M620 1060 L860 1060 L890 1250 L590 1250 Z", null, 0, { color: "#101828", w: 6 });
      L.s(ls, "path", { d: "M618 880 Q740 940 862 880 L850 1060 L630 1060 Z", fill: "#6DBE45", opacity: 0.85 });
      // the size chart flips and snaps on as the lid
      const lidCard = L.div("sz", lidS.cam, "left:560px;top:560px;width:360px;transform-origin:50% 100%");
      rowsSZ.forEach((r, i) => L.div("r" + (i ? "" : " h"), lidCard, "height:26px;font-size:12px;padding:0 10px;grid-template-columns:40px 1fr 1fr 1fr", r.map((c) => `<span>${c}</span>`).join("")));
      tl.fromTo(lidCard, { x: -120, y: -560, rotation: -40, scale: 1.3 }, { x: 0, y: -170, rotation: 0, scale: 1, duration: 0.3, ease: "power3.in" }, L5 - 0.05);
      tl.to(lidCard, { y: -70, scaleY: 0.35, duration: 0.12, ease: "power4.in" }, L5 + 0.25);
      tl.to(lidCard, { scaleY: 0.42, duration: 0.15, ease: "back.out(3)" }, L5 + 0.37);
      // the spatters wipe clean in one sweep; the parcels come back as check marks
      [...spG.children].sort((a, b) => a.getAttribute("cx") - b.getAttribute("cx")).forEach((s, i) => tl.to(s, { scale: 0, transformOrigin: "50% 50%", duration: 0.2, ease: "power2.in" }, L5 + 0.45 + i * 0.06));
      L.ink(ls, "M80 1150 C160 1110 260 1180 340 1120", L5 + 0.45, 0.45, { w: 10, color: "rgba(245,166,35,.55)" });
      const checks = [120, 250, 380].map((x, i) => {
        const p = L.div("abs", lidS.cam, `left:${x}px;top:1290px;width:100px;height:100px`, `<svg width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#34D399"/><path d="M28 52 L44 66 L72 36" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
        tl.fromTo(p, { x: -600, autoAlpha: 1 }, { x: 0, duration: 0.5, ease: "power3.out" }, L5 + 0.6 + i * 0.12);
        return p;
      });
      L.chip(lidS.cam, "SAMPLE SHOP DATA", "left:600px;top:1300px", L5 + 0.4);

      // ================= end card =================
      L.flip(lidS, EC - 0.45);
      const ecScene = L.endCard(EC - 0.45, "Comment the weirdest review<br/>you've ever gotten.", { anim: EC, size: 56 });
      gsap.set(ecScene.cam, { y: 30 }); // a little room for the Attention Legend card above the logo

      // ================= ATTENTION SPAN LEADERBOARD =================
      // Opens as a full-screen "ATTENTION TEST" card (the pre-roll) that lands as the meter.
      // Top 100% at the start; one tier per story beat; Top 0.01% for watching to the very end.
      const focusSecs = Math.round(T.total);
      const tBar = L.attentionTest({ top: 140, secs: focusSecs });
      L.attention({
        start: tBar,
        enter: "fade",
        top: 140,
        times: [H + 0.1, L2, L3, at("L3:complaint"), L4, at("L4.3"), EC + 0.6],
        labels: [
          { t: 1.25, until: 2.45, text: `${focusSecs}s OF FOCUS · TOP 0.01%`, color: "#A9C1F5" },
          { t: at("L4.3") + 1.55, until: L5 + 0.3, text: "DON'T BREAK THE STREAK", color: "#F08A63" },
          { t: EC - 1.25, until: EC - 0.05, text: "HOLD YOUR FOCUS", color: "#FFD66B" },
        ],
        countdown: EC - 0.9,
      });
      L.legend(EC + 0.6, { hold: T.total - EC, top: 264, sub: `${focusSecs} seconds of unbroken focus. Rank resets next reel. Follow and go longer.` });
      L.captions({ hide: [["L1.2", "L1e+0.3"], ["L2.3", "L2e+0.5"], ["L4.3", "L4e+0.5"], ["L5", "EC"]] });
      L.done();
    </script>
  </body>
